/* ---------- shared helpers for the English lessons ---------- */
const NSV='http://www.w3.org/2000/svg';
const C={blue:'#2F6FED',green:'#12A06C',purple:'#7B5CFA',orange:'#F0622F',pink:'#FF5D8F',gold:'#E0A100',teal:'#0F9DB0',ink:'#1B2A49'};
/* combined narration: an id listed in COMBO plays several lines one after another (Arabic + English voices) */
const _say=K.say;
K.say=function(id,o={}){const c=COMBO[id]; if(!c) return _say(id,o); if(!c.length) return {t0:K.S.t,t1:K.S.t};
  let f=null,r=null; c.forEach((x,i)=>{r=_say(x,Object.assign({},o,{gap:i<c.length-1?.2:(o.gap??.25)})); if(!f)f=r}); return {t0:f.t0,t1:r.t1}};
const tlx=()=>K.tl;
function pop(e,t,sfx=true){K.tl.from(e,{scale:.4,autoAlpha:0,duration:.5,ease:'back.out(1.7)',transformOrigin:'50% 50%'},t);if(sfx)K.S.events.push({t:t,sfx:'pop',gain:.5})}
function hide(e){K.tl.set(e,{autoAlpha:0},0)}
function show(e,t,sfx=true){K.tl.to(e,{autoAlpha:1,duration:.15},t);K.tl.from(e,{scale:.4,duration:.5,ease:'back.out(1.7)',transformOrigin:'50% 50%'},t);if(sfx)K.S.events.push({t:t,sfx:'pop',gain:.5})}
function enS(t){return `<span class="en">${t}</span>`}
/* picture box: {img:'img/x.png'} or {art:'name'} */
function picBox(parent,spec,x,y,w,h,o={}){const b=K.el(parent,'div','abs',{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:(o.r??18)+'px',overflow:'hidden',background:o.bg||'#F4F8FF',display:'flex',alignItems:'center',justifyContent:'center'});
  if(spec.img){const im=K.el(b,'img','',{width:'92%',height:'92%',objectFit:'contain'});im.setAttribute('src',spec.img)}
  else if(spec.art){b.innerHTML=artSvg(spec.art,Math.round(Math.min(w,h)*.9),Math.round(Math.min(w,h)*.9))}
  return b}
function chipEl(parent,html,o){const c=K.card(parent,{x:o.x,y:o.y,w:o.w,h:o.h,r:o.r||24,bg:o.bg||'#fff',css:{display:'flex',alignItems:'center',justifyContent:'center',border:`5px solid ${o.col||C.blue}`,padding:'2px 10px',overflow:'visible'}});
  K.el(c,'div',o.en?'en':'h1',{fontSize:(o.size||40)+'px',color:o.tc||o.col||C.blue,textAlign:'center',lineHeight:1.25,fontWeight:o.en?700:800},html);return c}

/* vocabulary scene: items [{k, en, ar, pic, enId?, arId?}] */
function vocab(id,title,items,o={}){
  K.slide(id,title,(el,S,t)=>{
    const n=items.length, gap=n>=5?14:20, w=n>=5?182:n===4?228:n===3?290:400, tot=n*w+(n-1)*gap, x0=40+(990-tot)/2, y=o.y||128, ph=Math.min(w-28,o.ph||200);
    const cards=items.map((it,i)=>{const x=x0+i*(w+gap);
      const c=K.card(el,{x,y,w,h:ph+150,r:28,css:{border:`5px solid ${o.col||C.blue}`}});
      picBox(c,it.pic,(w-10-ph)/2,10,ph,ph);
      const e=K.el(c,'div','en',{position:'absolute',left:0,right:0,top:(ph+18)+'px',textAlign:'center',fontSize:(it.en.length>10?(w>=290?40:30):it.en.length>7?(w>=290?44:36):46)+'px',color:o.col||C.blue,lineHeight:1.2},it.en);
      const a=K.el(c,'div','h1',{position:'absolute',left:'4px',right:'4px',top:(ph+78)+'px',textAlign:'center',fontSize:(it.ar.length>14?24:30)+'px',color:C.ink},it.ar);
      hide(c);hide(a);return {c,a}});
    if(o.intro) K.say(o.intro,{mood:'happy'});
    items.forEach((it,i)=>{let r=K.say(it.enId||('w_'+it.k),{gap:.15}); show(cards[i].c,r.t0); r=K.say(it.arId||('m_'+it.k),{gap:.35}); K.tl.to(cards[i].a,{autoAlpha:1,duration:.3},r.t0)});
    if(o.review){K.say('rp1',{gap:.1}); const r=K.say(o.review,{mood:'cheer'}); const d=(r.t1-r.t0)/n; cards.forEach((c,i)=>K.pulse(c.c,r.t0+i*d,Math.max(.5,d),1.07))}
    K.wait(.3);
  },{color:o.col||C.blue,titleSize:o.ts||44});
}
/* sentence rows: rows [{pic,en,ar,enId,arId}] */
function rows(id,title,R,o={}){
  K.slide(id,title,(el,S,t)=>{
    const n=R.length, rh=n>=4?112:140, step=rh+(n>=4?10:18), y0=o.y||(n>=4?112:122);
    const cs=R.map((r,i)=>{const c=K.card(el,{x:40,y:y0+i*step,w:980,h:rh,r:26,css:{border:`5px solid ${o.col||C.blue}`}});
      picBox(c,r.pic,10,8,rh-26,rh-26,{r:14});
      const e=K.el(c,'div','en',{position:'absolute',left:(rh+6)+'px',right:'20px',top:(n>=4?6:14)+'px',textAlign:'left',fontSize:(n>=4?40:46)+'px',color:C.ink,lineHeight:1.2},r.en);
