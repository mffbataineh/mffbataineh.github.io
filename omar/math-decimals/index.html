M.dots=function(a,b){a=+a;b=+b;let s='',x=0;const r=17;

  return M.svg(x,2*r+4,s)};
M.dotsub=function(a,b){a=+a;b=+b;let s='',x=0;const r=17;
  for(let i=0;i<a;i++){const gone=i>=a-b;s+=gone?`<circle cx="${x+r}" cy="${r+2}" r="${r}" fill="#fff" stroke="#9AA9C6" stroke-width="3" stroke-dasharray="6 5"/>`:`<circle cx="${x+r}" cy="${r+2}" r="${r}" fill="#19B37D" stroke="#1B2A49" stroke-width="3"/>`;x+=2*r+8}
  return M.svg(x,2*r+4,s)};
M.rodsN=function(n){n=+n;let s='';for(let i=0;i<n;i++)s+=M.rod(i*24,0);return M.svg(n*24-6,160,s,'height="170" width="'+Math.round((n*24-6)*170/160)+'"')};

M.cards=function(list){const v=list.split('-');let s='';v.forEach((n,i)=>{const x=i*130,c=CARDC[i%6];

/* ---------- column board for teaching (absolute digits that can be animated) ---------- */
function colBoard(parent,a,b,op,x,y,o={}){const fsz=o.size||92,cw=fsz*.72,rh=fsz*1.08;const A=String(a),B=String(b),n=Math.max(A.length,B.length,o.ans?String(o.ans).length:0);
  const box=K.el(parent,'div','abs',{left:x+'px',top:y+'px',width:(cw*(n+1)+20)+'px',height:(rh*3.6+30)+'px'});
  const mk=(ch,col,row,c)=>K.el(box,'div','mxd',{position:'absolute',left:(cw*(col+1))+'px',top:(row*rh+rh*.55)+'px',width:cw+'px',textAlign:'center',fontSize:fsz+'px',lineHeight:1,color:c||C.ink,fontFamily:"'Baloo',sans-serif",fontWeight:800},ch);
  const pad=s=>' '.repeat(n-s.length)+s; const R={a:[],b:[],r:[],carry:[],col:[]};
  for(let i=0;i<n;i++){R.col.push(K.el(box,'div','abs',{left:(cw*(i+1)-6)+'px',top:(rh*.4)+'px',width:(cw+12)+'px',height:(rh*3.35)+'px',borderRadius:'18px',background:'#FFF3B0',opacity:0}))}
  [...pad(A)].forEach((d,i)=>R.a.push(mk(d.trim(),i,1)));
  [...pad(B)].forEach((d,i)=>R.b.push(mk(d.trim(),i,2)));
  R.op=mk(op,-1,2,C.orange);
  R.line=K.el(box,'div','abs',{left:(cw*.1)+'px',top:(rh*3.48)+'px',width:(cw*(n+.9))+'px',height:'7px',borderRadius:'4px',background:C.ink});
  const ans=o.ans!=null?pad(String(o.ans)):' '.repeat(n);[...ans].forEach((d,i)=>{const e=mk(d.trim(),i,3,C.green);e.style.top=(3*rh+rh*.72)+'px';hide(e);R.r.push(e)});
  for(let i=0;i<n;i++){const e=mk('1',i,0,C.red);e.style.fontSize=(fsz*.55)+'px';e.style.top=(rh*.05)+'px';hide(e);R.carry.push(e)}
  R.box=box; return R}
function hiCol(R,i,t0,t1){K.tl.to(R.col[i],{opacity:1,duration:.25},t0).to(R.col[i],{opacity:0,duration:.25},t1)}

function numLine(parent,x,y,w,max,o={}){const step=(w-60)/max;const X=v=>30+v*step;let s=`<path d="M10 50H${w-10}" stroke="#1B2A49" stroke-width="5" stroke-linecap="round"/><path d="M${w-24} 40L${w-8} 50L${w-24} 60" stroke="#1B2A49" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  for(let v=0;v<=max;v++){s+=`<path d="M${X(v)} 38V62" stroke="#1B2A49" stroke-width="4"/><text x="${X(v)}" y="100" text-anchor="middle" font-size="${o.fs||30}" font-weight="800" fill="#1B2A49" font-family="Baloo">${v}</text>`}
  const d=K.el(parent,'div','abs',{left:x+'px',top:y+'px',width:w+'px',height:'120px',direction:'ltr'});d.innerHTML=M.svg(w,120,s);
  return {d,X,svg:d.firstChild}}
function arcHop(nl,a,b,t,col,label){const x0=nl.X(a),x1=nl.X(b),mx=(x0+x1)/2,len=Math.abs(x1-x0)*1.3;

  nl.svg.appendChild(g);const [p,h,tx]=g.children;K.tl.to(p,{strokeDashoffset:0,duration:.5,ease:'power1.inOut'},t).to(h,{opacity:1,duration:.1},t+.45);if(tx)K.tl.to(tx,{opacity:1,duration:.2},t+.2);sfxAt(t,'pop',.4);return g}
function htmlAt(parent,html,x,y,o={}){const e=K.el(parent,'div','abs',Object.assign({left:x+'px',top:y+'px',direction:'ltr'},o.css||{}),html);if(o.w)e.style.width=o.w+'px';return e}
