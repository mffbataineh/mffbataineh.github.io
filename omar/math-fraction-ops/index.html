M.flat=(x,y,c='#5B95F7')=>{let s=`<rect x="${x-3}" y="${y-3}" width="166" height="166" rx="5" fill="#fff"/><rect x="${x}" y="${y}" width="160" height="160" rx="3" fill="${c}" stroke="#1E4FB0" stroke-width="2.5"/>`;for(let i=1;i<10;i++)s+=`<path d="M${x+i*16} ${y}v160M${x} ${y+i*16}h160" stroke="#1E4FB0" stroke-width="1.1" opacity=".75"/>`;return s};
M.cube=(x,y,c='#8E6CFF')=>{const d=34;let s=`<path d="M${x} ${y+d}L${x+d} ${y}L${x+d+160} ${y}L${x+160} ${y+d}Z" fill="#B7A2FF" stroke="#4B2FB8" stroke-width="2.5"/><path d="M${x+160} ${y+d}L${x+d+160} ${y}L${x+d+160} ${y+160}L${x+160} ${y+160+d}Z" fill="#6A48E8" stroke="#4B2FB8" stroke-width="2.5"/><rect x="${x}" y="${y+d}" width="160" height="160" fill="${c}" stroke="#4B2FB8" stroke-width="2.5"/>`;
  for(let i=1;i<10;i++)s+=`<path d="M${x+i*16} ${y+d}v160M${x} ${y+d+i*16}h160" stroke="#4B2FB8" stroke-width="1" opacity=".6"/>`;return s};
/* blocks(n) -> {svg, w, h}; groups have class k1000/k100/k10/k1 and data-i */
M.blocksRaw=function(n,o={}){n=+n;const th=Math.floor(n/1000),h=Math.floor(n%1000/100),t=Math.floor(n%100/10),u=n%10;
  let x=0,s='';const H=200;const gap=o.gap??34;
  for(let i=0;i<th;i++){s+=`<g class="k1000" data-i="${i}">${M.cube(x,0)}</g>`;x+=i<th-1?60:200} if(th)x+=gap;
  for(let i=0;i<h;i++){s+=`<g class="k100" data-i="${i}">${M.flat(x,40-(o.flatUp?0:0))}</g>`;x+=i<h-1?(h<=4?172:84):160} if(h)x+=gap;
  for(let i=0;i<t;i++){s+=`<g class="k10" data-i="${i}">${M.rod(x,40)}</g>`;x+=i<t-1?24:18} if(t)x+=gap;
  for(let i=0;i<u;i++){const cx=x+Math.floor(i/5)*22, cy=40+(i%5)*22+60; s+=`<g class="k1" data-i="${i}">${M.unit(cx,cy)}</g>`} if(u)x+=Math.ceil(u/5)*22;
  return {s,w:Math.max(x,20),h:H}};
M.blocks=function(n,hgt){const r=M.blocksRaw(n);return M.svg(r.w,r.h,r.s,`height="${hgt||170}" width="${Math.round(r.w*(hgt||170)/r.h)}"`)};

M.pie=function(den,num,col,size){den=+den;num=+num;col=col||C.orange;size=+size||150;const r=size/2-4,cx=size/2,cy=size/2;let s='';
  for(let i=0;i<den;i++){const a0=-Math.PI/2+i*2*Math.PI/den,a1=a0+2*Math.PI/den;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+= den===1?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${i<num?col:'#fff'}" stroke="#1B2A49" stroke-width="3"/>`:`<path class="fp" d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${i<num?col:'#fff'}" stroke="#1B2A49" stroke-width="3" stroke-linejoin="round"/>`}

  for(let i=0;i<3;i++){const a=P[i],b=P[(i+1)%3];s+=`<path d="M${cx} ${cy}L${a[0]} ${a[1]}L${b[0]} ${b[1]}Z" fill="${i<num?col:'#fff'}" stroke="#1B2A49" stroke-width="3" stroke-linejoin="round"/>`}return M.svg(size,size,s)};

  return `<span style="display:inline-flex;gap:12px;align-items:center;direction:ltr">${s}</span>`};
/* ---- decimal models ---- */

M.hg=function(k,col,size){k=+k;col=col||C.green;size=+size||170;let s='';const c=(size-4)/10;
  for(let i=0;i<100;i++){const cx=Math.floor(i/10),cy=i%10;s+=`<rect x="${(2+cx*c).toFixed(1)}" y="${(2+cy*c).toFixed(1)}" width="${c.toFixed(1)}" height="${c.toFixed(1)}" fill="${i<k?col:'#fff'}" stroke="#1B2A49" stroke-width="1.2"/>`}

/* ---- shapes for patterns ---- */
M.sh=function(kind,col,size){size=+size||70;const z=size,h=z/2;let p='';const st='stroke="#1B2A49" stroke-width="4" stroke-linejoin="round"';
  const cols={hex:'#2F6FED',sq:'#FF9F1C',circ:'#19B37D',tri:'#FF5D8F',up:'#7B5CFA',down:'#0F9DB0',dia:'#E0A100',star:'#FFC93C'};col=col||cols[kind]||C.blue;
  if(kind==='hex'){const pts=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;pts.push((h+(h-4)*Math.cos(a)).toFixed(1)+','+(h+(h-4)*Math.sin(a)).toFixed(1))}p=`<polygon points="${pts.join(' ')}" fill="${col}" ${st}/>`}
  else if(kind==='sq')p=`<rect x="6" y="6" width="${z-12}" height="${z-12}" rx="6" fill="${col}" ${st}/>`;
  else if(kind==='circ')p=`<circle cx="${h}" cy="${h}" r="${h-5}" fill="${col}" ${st}/>`;
  else if(kind==='tri')p=`<polygon points="${h},5 ${z-5},${z-6} 5,${z-6}" fill="${col}" ${st}/>`;
  else if(kind==='dia')p=`<polygon points="${h},4 ${z-8},${h} ${h},${z-4} 8,${h}" fill="${col}" ${st}/>`;
  else if(kind==='up')p=`<polygon points="${h},4 ${z-6},${h} ${z*0.68},${h} ${z*0.68},${z-4} ${z*0.32},${z-4} ${z*0.32},${h} 6,${h}" fill="${col}" ${st}/>`;
  else if(kind==='down')p=`<polygon points="${h},${z-4} ${z-6},${h} ${z*0.68},${h} ${z*0.68},4 ${z*0.32},4 ${z*0.32},${h} 6,${h}" fill="${col}" ${st}/>`;
  return M.svg(z,z,p)};

/* ---------- quiz wrapper ---------- */
function OQ(id,n,total,o={}){const d=QD[id];
  const opts=d.opts.map(p=>{const r={};if(p.img)r.img=svgURI(p.img);if(p.pic)r.img=p.pic;r.t=fill(p.t||'');return r});
  const h=K.quiz({id,n,total,q:fill(d.q),qh:d.qh,qsize:d.qsize,qId:id+'Q',opts,optIds:d.optIds,correct:d.correct,layout:d.layout||undefined,timer:d.timer,multi:d.multi,
    askId:(n===1||o.ask)?undefined:false,ansId:id+'A',osize:d.osize});
  const sc=K.scenesLayer.lastElementChild; sc.querySelector('.pill').innerHTML=d.title;
  h.items.forEach(it=>{const ot=it.sh.querySelector('.ot'); if(ot&&d.num){ot.classList.add('num')}});

/* ---------- teaching slide: setup builds the picture, beats = [[lineId, fn(R,t0,t1), opts]] ---------- */
function teach(id,title,setup,beats,o={}){
  K.slide(id,title,(el,S,t)=>{const R=setup(el,t)||{};
    beats.forEach(b=>{const r=K.say(b[0],Object.assign({mood:'happy'},b[2]||{})); if(b[1])b[1](R,r.t0,r.t1)});
    K.wait(o.tail??.5)},{color:o.color||C.blue,titleSize:o.ts||44,mascot:o.mascot});
}
/* section opener with a big title and three picture cards */
function opener(id,tag,big,sub,pics,lines,col){
  K.scene(id,(el,S,t0)=>{K.mascotTo(t0,1040,430,.85,.5); K.mood(t0,'happy');
    const tg=K.el(el,'div','pill h1',{left:'50%',top:'34px',transform:'translateX(-50%)',background:col,fontSize:'34px',padding:'4px 40px'},tag);
    const b=K.el(el,'div','h1',{position:'absolute',left:'60px',right:'60px',top:'108px',textAlign:'center',fontSize:'64px',color:col,textShadow:'0 6px 0 rgba(255,255,255,.9)'},big);
    const s=K.el(el,'div','h1',{position:'absolute',left:'60px',right:'60px',top:'206px',textAlign:'center',fontSize:'36px',color:C.ink},sub);
    const pw=250,gap=26,tot=pics.length*pw+(pics.length-1)*gap,x0=(1000-tot)/2+20;
    const ps=pics.map((p,i)=>{const c=K.card(el,{x:x0+i*(pw+gap),y:290,w:pw,h:250,r:26,css:{border:`5px solid ${col}`,display:'flex',alignItems:'center',justifyContent:'center',direction:'ltr'}});c.innerHTML=fill(p);hide(c);return c});
    pop(tg,t0+.1); K.tl.from(b,{scale:.4,autoAlpha:0,duration:.8,ease:'elastic.out(1,.6)',transformOrigin:'50% 50%'},t0+.3); K.sfx('sparkle',.3,.5); K.tl.from(s,{autoAlpha:0,y:20,duration:.5},t0+.8);
    const r=K.say(lines[0],{mood:'cheer'}); ps.forEach((c,i)=>show(c,r.t0+.5+i*.35));
    for(let i=1;i<lines.length;i++)K.say(lines[i],{mood:'happy'});
    K.wait(.5)});
}
/* "challenge" banner between quiz groups */

function colBoard(parent,a,b,op,x,y,o={}){const fsz=o.size||92,cw=fsz*.72,rh=fsz*1.08;const A=String(a),B=String(b),n=Math.max(A.length,B.length,o.ans?String(o.ans).length:0);

function fillParts(svgHost,idxs,col,t,stag=.35){const ps=svgHost.querySelectorAll('.fp');idxs.forEach((i,j)=>{K.tl.to(ps[i],{attr:{fill:col},duration:.3},t+j*stag);sfxAt(t+j*stag,'pop',.35)})}

K.init({theme:'sunset', music:'music_happy', musicGain:.10});
K.titleScene({title:'الرِّيَاضِيَّاتُ مَعَ '+KID.name,sub:'جَمْعُ الْكُسُورِ وَطَرْحُهَا وَضَرْبُهَا',say:['t1','t2']});

/* adding like fractions with moving bar pieces */
teach('fa','جَمْعُ الْكُسُورِ الْمُتَشَابِهَةِ',(el,t)=>{
  const ex=htmlAt(el,`<span class="mx" style="font-size:96px"><span class="fr"><b class="n1">1</b><b class="d1">5</b></span> + <span class="fr"><b class="n2">2</b><b class="d2">5</b></span> = <span class="fr" id="res"><b class="n3">3</b><b class="d3">5</b></span></span>`,250,110);
  K.tl.from(ex,{autoAlpha:0,y:-30,duration:.5},t+.2); const res=ex.querySelector('#res'); hide(res);
  const b1=htmlAt(el,M.bar(5,1,'#7B5CFA',600,80),220,330), b2=htmlAt(el,M.bar(5,2,'#FF9F1C',600,80),220,430);hide(b1);hide(b2);
  const b3=htmlAt(el,M.svg(600,80,[0,1,2,3,4].map(i=>`<rect class="fp" x="${2+i*119.2}" y="2" width="119.2" height="76" fill="${i===0?'#7B5CFA':i<3?'#FF9F1C':'#fff'}" stroke="#1B2A49" stroke-width="3"/>`).join('')),220,380);hide(b3);
  return {ex,res,b1,b2,b3}},
 [['a1',(R,t0)=>{['.d1','.d2'].forEach((c,i)=>{const e=R.ex.querySelector(c);K.tl.to(e,{color:C.orange,duration:.3},t0+1+i*.4)})}],
  ['a2',(R,t0)=>{show(R.b1,t0+.2);show(R.b2,t0+.8)}],
  ['a3',(R,t0,t1)=>{['.n1','.n2'].forEach((c,i)=>{const e=R.ex.querySelector(c);K.tl.to(e,{color:C.green,scale:1.3,duration:.3},t0+1+i*.6).to(e,{scale:1,duration:.3},t0+1.6+i*.6)});
     K.tl.to(R.b1,{y:50,autoAlpha:0,duration:.6},t1-1); K.tl.to(R.b2,{y:-50,autoAlpha:0,duration:.6},t1-1); K.tl.to(R.b3,{autoAlpha:1,duration:.3},t1-.5); sfxAt(t1-.5,'whoosh',.4)}],
  ['a4',(R,t0)=>{show(R.res,t0+.3); K.pulse(R.b3,t0+1.5,.6,1.05); sfxAt(t0+.5,'ding',.5)},{mood:'cheer'}]],{color:C.orange});
OQs(['qa1','qa2','qa3','qa4','qa5','qa6'],6);

banner('bn1s','طَرْحُ الْكُسُورِ','bn1',C.purple);
teach('fs','طَرْحُ الْكُسُورِ الْمُتَشَابِهَةِ',(el,t)=>{
  const ex=htmlAt(el,`<span class="mx" style="font-size:96px">${M.fr(3,4)} - ${M.fr(1,4)} = <span id="res">${M.fr(2,4)}</span></span>`,250,110);
  K.tl.from(ex,{autoAlpha:0,y:-30,duration:.5},t+.2); const res=ex.querySelector('#res'); hide(res);
  const b=htmlAt(el,M.bar(4,3,'#19B37D',640,110),200,350);hide(b);
  return {res,b}},
 [['b1',null],
  ['b2',(R,t0)=>{show(R.b,t0+.3)}],
  ['b3',(R,t0)=>{const p=R.b.querySelectorAll('.fp')[2];K.tl.to(p,{attr:{fill:'#fff'},duration:.5},t0+2);K.tl.fromTo(p,{opacity:1},{opacity:.4,duration:.3,yoyo:true,repeat:3},t0+1.2);sfxAt(t0+2,'whoosh',.4)}],
  ['b4',(R,t0)=>{show(R.res,t0+.2);sfxAt(t0+.4,'ding',.5)},{mood:'cheer'}]],{color:C.purple});
OQs(['qs1','qs2','qs3','qs4','qs5','qs6'],6);

banner('bn2s','جَمْعُ الْأَعْدَادِ الْكَسْرِيَّةِ','bn2',C.blue);
teach('fm','جَمْعُ الْأَعْدَادِ الْكَسْرِيَّةِ',(el,t)=>{
  const ex=htmlAt(el,`<span class="mx" style="font-size:100px"><span class="mxd"><span class="w1">1</span>${M.fr(1,7).replace('class="fr"','class="fr f1"')}</span> + <span class="mxd"><span class="w2">5</span>${M.fr(3,7).replace('class="fr"','class="fr f2"')}</span></span>`,230,120);
  K.tl.from(ex,{autoAlpha:0,y:-30,duration:.5},t+.2);
  const w=htmlAt(el,'<span class="mx" style="font-size:84px;color:#2F6FED">1 + 5 = 6</span>',300,300);hide(w);
  const f=htmlAt(el,`<span class="mx" style="font-size:84px;color:#F0622F">${M.fr(1,7)} + ${M.fr(3,7)} = ${M.fr(4,7)}</span>`,600,300);hide(f);
  const r=htmlAt(el,`<span class="mx" style="font-size:100px">= <span style="color:#12A06C">${M.mx(6,4,7)}</span></span>`,380,440);hide(r);
  return {ex,w,f,r}},
 [['c1',null],
  ['c2',(R,t0)=>{['.w1','.w2'].forEach(c=>K.tl.to(R.ex.querySelector(c),{color:C.blue,duration:.3},t0+.5)); K.tl.set(R.w,{left:120},0); show(R.w,t0+1.6)}],
  ['c3',(R,t0)=>{['.f1','.f2'].forEach(c=>K.tl.to(R.ex.querySelector(c),{color:C.orange,duration:.3},t0+.5)); show(R.f,t0+2)}],
  ['c4',(R,t0)=>{show(R.r,t0+.3);sfxAt(t0+.5,'ding',.5)},{mood:'cheer'}]],{color:C.blue});
OQs(['qm1','qm2','qm3','qm4','qm5'],5);

banner('bn3s','ضَرْبُ الْكُسُورِ','bn3',C.green);
teach('fx','ضَرْبُ الْكُسُورِ فِي الْأَعْدَادِ الْكُلِّيَّةِ',(el,t)=>{
  const ex=htmlAt(el,`<span class="mx" style="font-size:90px">3 × ${M.fr(2,5)} = <span id="res">${M.fr(6,5)}</span></span>`,300,105);
  K.tl.from(ex,{autoAlpha:0,y:-30,duration:.5},t+.2); const res=ex.querySelector('#res'); hide(res);
  const bars=[0,1,2].map(i=>{const e=htmlAt(el,M.bar(5,2,['#FF9F1C','#2F6FED','#FF5D8F'][i],280,70),40+i*340,300);hide(e);return e});
  const pl=[0,1].map(i=>{const e=htmlAt(el,'<span class="mx" style="font-size:60px">+</span>',334+i*340,292);hide(e);return e});
  const calc=htmlAt(el,'<span class="mx" style="font-size:70px">3 × 2 = 6</span>',340,410);hide(calc);
  return {res,bars,pl,calc}},
 [['d1',null],
  ['d2',(R,t0,t1)=>{const d=(t1-t0)/3.4;R.bars.forEach((b,i)=>{show(b,t0+.6+i*d);if(i)show(R.pl[i-1],t0+.4+i*d,false)})}],
  ['d3',(R,t0)=>{show(R.calc,t0+.5)}],
  ['d4',(R,t0)=>{show(R.res,t0+.3);sfxAt(t0+.5,'ding',.5)},{mood:'cheer'}]],{color:C.green});
OQs(['qx1','qx2','qx3','qx4','qx5','qx6'],6);
K.finaleScene({title:'أَحْسَنْتَ يَا '+KID.name+'!',say:['end1','end2','end3'],sub:''});
K.start({title:'الرِّيَاضِيَّاتُ: الْعَمَلِيَّاتُ عَلَى الْكُسُورِ',sub:'الْجَمْعُ، الطَّرْحُ، الْأَعْدَادُ الْكَسْرِيَّةُ، الضَّرْبُ'});

</script></body></html>
