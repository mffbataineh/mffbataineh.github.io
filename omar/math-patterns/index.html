    box.innerHTML=g.map(k=>M.sh(k,null,96)).join('');hide(box);return box});

 [['p4',(R,t0)=>{show(R.groups[0],t0+.3)}],
  ['p5',(R,t0,t1)=>{const d=(t1-t0)/3;R.groups.forEach((g,i)=>{if(i)show(g,t0+i*d);K.pulse(g,t0+i*d+.2,.6,1.04)})}]],{color:C.pink});

  return {nl,dots,big}},
 [['n1',null],

  ['n3',(R,t0,t1)=>{arcHop(R.nl,8,10,t1-1.6,C.green,'+2'); show(R.dots[4],t1-1.1); show(R.big,t0+.5)},{mood:'cheer'}]],{color:C.blue});

/* sequences with coloured cards */

  const arcs=[0,1,2].map(i=>{const e=htmlAt(el,M.svg(200,70,`<path d="M30 60Q100 0 170 60" stroke="#FF9F1C" stroke-width="6" fill="none"/><path d="M158 46L170 60L152 62" stroke="#FF9F1C" stroke-width="6" fill="none"/><text x="100" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#F0622F" font-family="Baloo">+3</text>`),100+i*200+80,418);hide(e);return e});
  return {cards,qs,rule,arcs}},
 [['q1',(R,t0)=>{show(R.rule,t0+.2); show(R.cards[0],t0+.8); show(R.cards[1],t0+1.1); show(R.qs[0],t0+1.4,false); show(R.qs[1],t0+1.6,false)}],
  ['q2',(R,t0)=>{show(R.arcs[0],t0+.2); K.pulse(R.cards[1],t0+1,.6,1.1)}],
  ['q3',(R,t0)=>{show(R.arcs[1],t0+.2); K.tl.to(R.qs[0],{autoAlpha:0,duration:.2},t0+1); show(R.cards[2],t0+1.1)}],
  ['q4',(R,t0)=>{show(R.arcs[2],t0+.2); K.tl.to(R.qs[1],{autoAlpha:0,duration:.2},t0+1); show(R.cards[3],t0+1.1); sfxAt(t0+1.2,'ding',.5)},{mood:'cheer'}]],{color:C.orange});
OQs(['qq1','qq2','qq3','qq4'],4);

/* number machine */

teach('mach','آلَةُ الْأَعْدَادِ',(el,t)=>{

  K.el(mach,'div','abs',{right:'20px',top:'18px',width:'40px',height:'40px',borderRadius:'50%',background:'#FF5D8F',border:'4px solid #1B2A49'});
  const rl=K.el(mach,'div','h1',{color:'#fff',fontSize:'46px',marginTop:'30px'},'اجْمَعْ 7');hide(rl);
  K.tl.from(mach,{scale:.5,autoAlpha:0,duration:.6,ease:'back.out(1.6)'},t+.2);

  const ball=(v,c)=>{const e=K.el(el,'div','mxd',{position:'absolute',left:'790px',top:'220px',width:'110px',height:'110px',borderRadius:'50%',background:c,border:'5px solid #1B2A49',display:'flex',justifyContent:'center',fontSize:'58px',color:'#fff'},v);hide(e);return e};
  const i1=ball('2','#FF9F1C'),o1=ball('9','#19B37D'),i2=ball('4','#FF9F1C'),o2=ball('11','#19B37D');
  const tab=htmlAt(el,M.iotab('2|9;4|11'),400,420);hide(tab);
  return {rl,i1,o1,i2,o2,tab,inL,outL}},
 [['m1',null],
  ['m2',(R,t0)=>{show(R.rl,t0+.4)}],
  ...[['m3','i1','o1'],['m4','i2','o2']].map(([id,a,b])=>[id,(R,t0,t1)=>{show(R[a],t0); K.tl.to(R[a],{left:520,scale:.4,autoAlpha:0,duration:.7,ease:'power2.in'},t0+.7); sfxAt(t0+1.3,'whoosh',.4);
     K.tl.set(R[b],{left:470},0); K.tl.to(R[b],{autoAlpha:1,duration:.1},t0+1.5).fromTo(R[b],{left:420,scale:.4},{left:90,scale:1,duration:.7,ease:'back.out(1.6)'},t0+1.5); K.tl.to(R[b],{autoAlpha:0,duration:.3},t1+.1); sfxAt(t0+1.9,'pop',.5)}]),
  ['m5',(R,t0)=>{show(R.tab,t0+.2)},{mood:'cheer'}]],{color:C.teal});
OQs(['qt1','qt2','qt3','qt4','qt5','qt6','qt7','qt8'],8);

/* order of operations */
banner('bn3s','تَرْتِيبُ الْعَمَلِيَّاتِ','bn3',C.orange);
teach('ord','تَرْتِيبُ الْعَمَلِيَّاتِ',(el,t)=>{
  const ex=htmlAt(el,'<span class="mx" style="font-size:96px"><span class="par">(</span><span id="ib">8 + 5</span><span class="par">)</span> - 2</span>',250,130);
  K.tl.from(ex,{autoAlpha:0,y:-30,duration:.5},t+.2);
  const box=K.el(el,'div','abs',{left:'250px',top:'128px',width:'350px',height:'130px',border:'6px solid #FF9F1C',borderRadius:'26px'});hide(box);

  const s1=htmlAt(el,'<span class="mx" style="font-size:80px">13 - 2</span>',330,330);hide(s1);
  const s2=htmlAt(el,'<span class="mx" style="font-size:80px">= <span style="color:#12A06C">11</span></span>',585,330);hide(s2);
  const lab=K.el(el,'div','h1',{position:'absolute',left:'60px',top:'470px',width:'900px',textAlign:'center',fontSize:'38px',color:C.purple},'1. الْأَقْوَاسُ أَوَّلًا &nbsp; 2. ثُمَّ الْجَمْعُ وَالطَّرْحُ');hide(lab);
  return {box,arr,s1,s2,lab}},
 [['o1',(R,t0)=>{show(R.box,t0+.5,false); K.glow(R.box,t0+1,1)}],
  ['o2',(R,t0)=>{show(R.arr,t0+.3,false); K.tl.from(R.arr,{scaleX:0,transformOrigin:'0% 50%',duration:.8},t0+.3); show(R.lab,t0+1.5,false)}],
  ['o3',(R,t0,t1)=>{show(R.s1,t1-.8)}],
  ['o4',(R,t0,t1)=>{show(R.s2,t1-.8); sfxAt(t1-.6,'ding',.5)},{mood:'cheer'}]],{color:C.orange});
OQs(['qo1','qo2','qo3','qo4'],4);
K.finaleScene({title:'أَحْسَنْتَ يَا '+KID.name+'!',say:['end1','end2','end3'],sub:''});

</script></body></html>
