/* blocks(n) -> {svg, w, h}; groups have class k1000/k100/k10/k1 and data-i */

  return {p,f}},
 [['g1',null],
  ['g2',(R,t0,t1)=>{fillParts(R.p,[0,1],'#7B5CFA',t0+1,1.6); show(R.f,t1-.8); sfxAt(t1-.6,'ding',.5)},{mood:'cheer'}]],{color:C.purple});
OQs(['qf1','qf2','qf3','qf4','qf5','qf6'],6);

/* comparing unit fractions */
teach('cmp','مُقَارَنَةُ الْكُسُورِ',(el,t)=>{
  const b1=htmlAt(el,M.bar(3,1,'#7B5CFA',700,90),170,150), b2=htmlAt(el,M.bar(5,1,'#FF9F1C',700,90),170,280);
  const l1=htmlAt(el,`<span class="mx" style="font-size:52px">${M.fr(1,3)}</span>`,70,145), l2=htmlAt(el,`<span class="mx" style="font-size:52px">${M.fr(1,5)}</span>`,70,275);
  K.tl.from([b1,l1,b2,l2],{autoAlpha:0,x:-40,duration:.4,stagger:.2},t+.3);
  const hl=K.el(el,'div','abs',{left:'168px',top:'146px',width:'238px',height:'98px',border:'7px solid #12A06C',borderRadius:'10px'});hide(hl);
  const hl2=K.el(el,'div','abs',{left:'168px',top:'276px',width:'144px',height:'98px',border:'7px solid #12A06C',borderRadius:'10px'});hide(hl2);
  const res=htmlAt(el,`<span class="mx" style="font-size:96px">${M.fr(1,3)} <span style="color:#12A06C">&gt;</span> ${M.fr(1,5)}</span>`,320,410);hide(res);
  return {hl,hl2,res}},
 [['k1',null],
  ['k2',(R,t0)=>{show(R.hl,t0+.5,false);show(R.hl2,t0+.9,false)}],
  ['k3',null],
  ['k4',(R,t0)=>{show(R.res,t0+.3); sfxAt(t0+.5,'ding',.5)},{mood:'cheer'}]],{color:C.purple});
OQs(['qc1','qc2','qc3','qc4','qc5','qc6'],6);

/* ordering */
teach('ordf','تَرْتِيبُ الْكُسُورِ',(el,t)=>{
  const cs=[1,2,3,4].map((k,i)=>{const c=K.card(el,{x:40+i*245,y:118,w:225,h:370,r:26,css:{border:`5px solid ${C.green}`}});
    K.el(c,'div','abs',{left:0,right:0,top:'18px',display:'flex',justifyContent:'center',direction:'ltr'},M.sq(4,k,'#19B37D',170));
    K.el(c,'div','abs',{left:0,right:0,top:'200px',display:'flex',justifyContent:'center',fontSize:'60px'},`<span class="fr">${'<b>'+k+'</b><b>4</b>'}</span>`);hide(c);return c});
  const arr=htmlAt(el,M.svg(960,60,`<path d="M10 30H930" stroke="#F0622F" stroke-width="7" stroke-linecap="round"/><path d="M905 10L935 30L905 50" stroke="#F0622F" stroke-width="7" fill="none" stroke-linecap="round"/>`),40,498);hide(arr);
  const a1=K.el(el,'div','h1',{position:'absolute',left:'40px',top:'540px',fontSize:'32px',color:C.orange},'الْأَصْغَرُ'),a2=K.el(el,'div','h1',{position:'absolute',left:'880px',top:'540px',fontSize:'32px',color:C.orange},'الْأَكْبَرُ');hide(a1);hide(a2);
  return {cs,arr,a1,a2}},
 [['h1',(R,t0)=>{show(R.arr,t0+.5,false);K.tl.from(R.arr,{scaleX:0,transformOrigin:'0% 50%',duration:.8},t0+.5);show(R.a1,t0+.8,false);show(R.a2,t0+1.2,false)}],
  ['h2',(R,t0,t1)=>{const d=(t1-t0)/4.2;R.cs.forEach((c,i)=>show(c,t0+i*d))},{mood:'cheer'}]],{color:C.green});
OQs(['qh1','qh2','qh3'],3);

/* mixed numbers */
teach('mix','الْأَعْدَادُ الْكَسْرِيَّةُ',(el,t)=>{
  const sqs=[4,4,1].map((k,i)=>{const e=htmlAt(el,M.sq(4,k,'#2F6FED',200),70+i*240,140);hide(e);return e});
  const cnt=[];[0,1,2].forEach(s=>{for(let j=0;j<(s<2?4:1);j++){const n=s*4+j+1,x=70+s*240+(j%2)*98+30,y=140+Math.floor(j/2)*98+22;
    const e=K.el(el,'div','mxd',{position:'absolute',left:x+'px',top:y+'px',fontSize:'46px',color:'#fff'},String(n));hide(e);cnt.push(e)}});
  const m=htmlAt(el,`<span class="mx" style="font-size:110px">${M.mx(2,1,4)}</span>`,780,150);hide(m);
  const im=htmlAt(el,`<span class="mx" style="font-size:90px">= ${M.fr(9,4)}</span>`,380,380);hide(im);
  return {sqs,cnt,m,im}},
 [['x1',null],
  ['x2',(R,t0)=>{show(R.sqs[0],t0+.2);show(R.sqs[1],t0+.6)}],
  ['x3',(R,t0,t1)=>{show(R.sqs[2],t0+.3); show(R.m,t1-.8)}],
  ['x4',(R,t0,t1)=>{const d=(t1-t0-.5)/9;R.cnt.forEach((e,i)=>show(e,t0+.3+i*d,true)); show(R.im,t1-.3)}],
  ['x5',(R,t0)=>{K.pulse(R.im,t0+.5,.8,1.08)},{mood:'cheer'}]],{color:C.blue});
OQs(['qx1','qx2','qx3','qx4','qx5'],5);
K.finaleScene({title:'أَحْسَنْتَ يَا '+KID.name+'!',say:['end1','end2','end3'],sub:''});
K.start({title:'الرِّيَاضِيَّاتُ: الْمُضَاعَفَاتُ وَالْكُسُورُ',sub:'الْمُضَاعَفَاتُ، الْأَعْدَادُ الْأَوَّلِيَّةُ، الْكُسُورُ، الْأَعْدَادُ الْكَسْرِيَّةُ'});

</script></body></html>
