<style>
  :root { --navy:#1a3b6d; --mid:#0b1630; --deep:#1e4fa3; --gold:#e0a640; --ink:#e9eef8; --muted:#9fb0cf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
         background: radial-gradient(1200px 700px at 70% -10%, #23508f 0%, transparent 60%),
                     linear-gradient(160deg, var(--mid) 0%, var(--navy) 55%, var(--deep) 100%);
         background-attachment: fixed; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
         background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                           linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
         background-size: 40px 40px; }
  .wrap { position: relative; max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
  .brand { color: var(--gold); letter-spacing: .14em; font-weight: 800; font-size: 13px; text-transform: uppercase; }
  h1 { font-size: clamp(34px, 6vw, 56px); margin: 8px 0 4px; font-weight: 800; }
  .sub { color: var(--muted); margin: 0 0 6px; }
  .ar { font-family: Amiri, "Times New Roman", serif; direction: rtl; }
  .rule { height: 2px; width: 90px; background: var(--gold); margin: 22px 0; border-radius: 2px; }
  .card { background: rgba(11,22,48,.55); border: 1px solid rgba(224,166,64,.35); border-radius: 18px;
          padding: 28px; margin: 18px 0; backdrop-filter: blur(4px); }
  .ep { color: var(--gold); font-weight: 800; letter-spacing: .1em; font-size: 13px; }
  .t-en { font-size: 28px; font-weight: 800; margin: 8px 0 2px; }
  .t-ar { font-size: 30px; font-weight: 700; margin: 2px 0 10px; }
  .soon { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px;
          background: rgba(224,166,64,.15); color: var(--gold); font-weight: 600; }
  .soon .ar { font-size: 19px; margin-inline-start: 10px; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px;
         font-weight: 700; text-decoration: none; color: var(--mid); background: var(--gold); }
  .btn.alt { background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,.35); }
  .btn .ar { font-size: 18px; font-weight: 700; }
  .unit { margin-top: 26px; }
  .unit h2 { font-size: 15px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
  .unit h2 .ar { text-transform: none; letter-spacing: 0; font-size: 19px; float: right; }
  .row { display: grid; grid-template-columns: 46px 1fr 1fr auto; gap: 12px; align-items: center;
         padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .row .n { color: var(--gold); font-weight: 800; }
  .row .ar { text-align: right; font-size: 18px; }
  .row .links a { color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; margin-left: 8px;
                  padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); }
  .row .links a.live { background: var(--gold); color: var(--mid); border-color: var(--gold); }
  footer { color: var(--muted); font-size: 13px; margin-top: 34px; }
  @media (max-width: 640px) { .row { grid-template-columns: 36px 1fr auto; } .row .ar { grid-column: 2 / 3; } }
</style>

function buttons() {
  return `<div class="btns">

function episodePage(lang, n) {
  const e = EPISODES[n];
  const v = VIDEOS[lang + pad(n)] || {};
  if (v.long) { location.replace("https://youtu.be/" + v.long); return; }
  document.title = `Calculus III, Episode ${pad(n)} | ${e.en}`;
  const short = v.short ? `<a class="btn alt" href="https://youtube.com/shorts/${v.short}" target="_blank" rel="noopener">Watch the Short <span class="ar">شاهد المقطع القصير</span></a>` : "";
  const other = lang === "en" ? "ar" : "en";
  const ov = VIDEOS[other + pad(n)] || {};
  const otherLink = ov.long ? `<a class="btn alt" href="https://youtu.be/${ov.long}">${other === "ar" ? "<span class='ar'>النسخة العربية</span>" : "English version"}</a>` : "";
  const titles = lang === "ar"
    ? `<div class="t-ar ar">${esc(e.ar)}</div><div class="t-en">${esc(e.en)}</div>`
    : `<div class="t-en">${esc(e.en)}</div><div class="t-ar ar">${esc(e.ar)}</div>`;
  document.getElementById("app").innerHTML = `
    <div class="brand">Calculus III · Dr. Mohammad Al Bataineh</div>
    <div class="card">
      <div class="ep">EPISODE ${pad(n)} · <span class="ar">الحلقة ${pad(n)}</span></div>

      ${buttons().replace('<div class="btns">', '<div class="btns">' + short + otherLink)}
    </div>
    <p><a href="./" style="color:var(--gold)">All 44 episodes · جميع الحلقات</a></p>`;
}

function indexPage() {
  let html = `<div class="brand">Dr. Mohammad Al Bataineh · <span class="ar">د. محمد البطاينة</span></div>
    <h1>Calculus III</h1>
    <p class="sub">Multivariable Calculus in 44 Video Lessons, in English and Arabic</p>
    <p class="ar" style="font-size:26px;margin:4px 0">التفاضل والتكامل 3: التفاضل والتكامل بعدة متغيرات في 44 درسًا مصوّرًا</p>
    <div class="rule"></div>${buttons()}`;
  for (const u of UNITS) {
    html += `<div class="unit"><h2>${esc(u.en)} <span class="ar">${esc(u.ar)}</span></h2>`;
    for (const n of u.eps) {
      const e = EPISODES[n];
      const link = l => {
        const v = VIDEOS[l + pad(n)] || {};
        return v.long ? `<a class="live" href="https://youtu.be/${v.long}">${l.toUpperCase()}</a>` : `<a href="#${l}${pad(n)}">${l.toUpperCase()}</a>`;
      };
      html += `<div class="row"><span class="n">${pad(n)}</span><span>${esc(e.en)}</span><span class="ar">${esc(e.ar)}</span><span class="links">${link("en")}${link("ar")}</span></div>`;
    }
    html += `</div>`;
  }
  html += `<footer>© 2026 Dr. Mohammad Al Bataineh · <a style="color:var(--gold)" href="https://www.youtube.com/@mffbataineh">youtube.com/@mffbataineh</a></footer>`;
  document.getElementById("app").innerHTML = html;
  document.title = "Calculus III | Dr. Mohammad Al Bataineh";
}

function route() {
  const m = /^#?(en|ar)(\d{2})$/.exec(location.hash);
  if (m && EPISODES[+m[2]]) episodePage(m[1], +m[2]); else indexPage();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
