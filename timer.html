<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .timer-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100px;
            padding: 15px;
            font-size: 1.5em;
            border: 3px solid #667eea;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .display-section {
            margin: 40px 0;
        }

        .circle-progress {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
        }

        .circle-bg {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 15;
        }

        .circle-progress-bar {
            fill: none;
            stroke: #667eea;
            stroke-width: 15;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .time-display.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .pause-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .pause-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background: #d0d0d0;
            transform: translateY(-3px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .message {
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
            min-height: 30px;
        }

        .message.finished {
            color: #4caf50;
            animation: bounce 0.5s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <h1>⏱️ Activity Timer</h1>
        
        <div class="input-section" id="inputSection">
            <div class="input-group">
                <label for="minutes">Minutes:</label>
                <input type="number" id="minutes" min="0.5" max="99" step="0.5" value="5" />
            </div>
        </div>

        <div class="display-section">
            <div class="circle-progress">
                <svg width="280" height="280">
                    <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
                    <circle class="circle-progress-bar" id="progressCircle" cx="140" cy="140" r="130"></circle>
                </svg>
                <div class="time-display" id="timeDisplay">00:00</div>
            </div>
        </div>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="pause-btn hidden" id="pauseBtn">Pause</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = false;

        const minutesInput = document.getElementById('minutes');
        const timeDisplay = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const message = document.getElementById('message');
        const progressCircle = document.getElementById('progressCircle');
        const inputSection = document.getElementById('inputSection');

        const circumference = 2 * Math.PI * 130;
        progressCircle.style.strokeDasharray = circumference;
        progressCircle.style.strokeDashoffset = circumference;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(remainingSeconds);
            
            // Update progress circle
            const progress = remainingSeconds / totalSeconds;
            const offset = circumference - (progress * circumference);
            progressCircle.style.strokeDashoffset = offset;

            // Warning state in last 10 seconds
            if (remainingSeconds <= 10 && remainingSeconds > 0) {
                timeDisplay.classList.add('warning');
                progressCircle.style.stroke = '#ff6b6b';
            } else {
                timeDisplay.classList.remove('warning');
                progressCircle.style.stroke = '#667eea';
            }
        }

        function startTimer() {
            if (!isRunning) {
                const minutes = parseFloat(minutesInput.value) || 5;
                totalSeconds = Math.round(minutes * 60);
                remainingSeconds = totalSeconds;
                minutesInput.disabled = true;
                inputSection.style.opacity = '0.5';
            }

            isRunning = true;
            isPaused = false;
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            message.textContent = '';
            message.classList.remove('finished');

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    finishTimer();
                }
            }, 1000);

            updateDisplay();
        }

        function pauseTimer() {
            isPaused = true;
            clearInterval(timerInterval);
            startBtn.textContent = 'Resume';
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            message.textContent = 'Paused';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isPaused = false;
            remainingSeconds = 0;
            totalSeconds = 0;
            
            minutesInput.disabled = false;
            inputSection.style.opacity = '1';
            
            timeDisplay.textContent = '00:00';
            timeDisplay.classList.remove('warning');
            progressCircle.style.strokeDashoffset = circumference;
            progressCircle.style.stroke = '#667eea';
            
            startBtn.textContent = 'Start';
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            message.textContent = '';
            message.classList.remove('finished');
        }

        function finishTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            message.textContent = '🎉 Time\'s Up!';
            message.classList.add('finished');
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            // Play alarm sound (three beeps)
            playAlarm();
        }

        function playAlarm() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Play 3 beeps
                const beepTimes = [0, 0.4, 0.8];
                
                beepTimes.forEach(startTime => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 880; // Higher pitch (A5 note)
                    oscillator.type = 'square'; // More attention-grabbing sound
                    
                    const start = audioContext.currentTime + startTime;
                    const end = start + 0.2;
                    
                    gainNode.gain.setValueAtTime(0, start);
                    gainNode.gain.linearRampToValueAtTime(0.5, start + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, end);
                    
                    oscillator.start(start);
                    oscillator.stop(end);
                });
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Allow Enter key to start timer
        minutesInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isRunning) {
                startTimer();
            }
        });
    </script>
</body>
</html>
